name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Test Linux input with uinput
        if: runner.os == 'Linux'
        run: |
          sudo modprobe uinput || true
          go test -c -o evdev.test ./internal/evdev
          sudo ./evdev.test -test.v
          go test -c -o lanhop.test ./cmd/lanhop
          sudo ./lanhop.test -test.v
