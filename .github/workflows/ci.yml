name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Test the macOS build without cgo
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "0"
        run: go test ./cmd/lanhop
      - name: Check the installer script
        if: runner.os == 'Linux'
        run: shellcheck install.sh
      - name: Test Linux input with uinput
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo modprobe uinput || true
          go test -race -c -o evdev.test ./internal/evdev
          (cd internal/evdev && sudo ../../evdev.test -test.v) | tee evdev.log
          if grep -e '--- SKIP' evdev.log; then
            echo "::error::a Linux input test was skipped, so uinput is not usable on this runner"
            exit 1
          fi
          go test -race -c -o lanhop.test ./cmd/lanhop
          sudo ./lanhop.test -test.v
