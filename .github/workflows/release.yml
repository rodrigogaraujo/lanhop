name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: The version that the program and UPDATE carry. A manual run signs with a throwaway certificate and key, and publishes nothing
        required: true
        default: v0.0.1

permissions:
  contents: read

env:
  VERSION: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || inputs.version || 'v0.0.1' }}
  RELEASE_RUN: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check the version and the oldest version it updates from
        run: |
          from=$(cat packaging/update-from)
          scripts/release/check-version "$VERSION"
          scripts/release/check-version "$from"
          if [ "$(printf '%s\n' "$from" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ] && [ "$RELEASE_RUN" = true ]; then
            echo "::error::packaging/update-from names $from, above the release $VERSION"
            exit 1
          fi

  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            cgo: 0
            looks_like: "ELF 64-bit LSB executable, x86-64"
            runs_here: true
          - os: linux
            arch: arm64
            runner: ubuntu-latest
            cgo: 0
            looks_like: "ELF 64-bit LSB executable, ARM aarch64"
            runs_here: false
          - os: darwin
            arch: arm64
            runner: macos-latest
            cgo: 1
            oldest_macos: "11.0"
            looks_like: "Mach-O 64-bit executable arm64"
            runs_here: true
          - os: darwin
            arch: amd64
            runner: macos-latest
            cgo: 1
            oldest_macos: "11.0"
            looks_like: "Mach-O 64-bit executable x86_64"
            runs_here: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: ${{ matrix.cgo }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.oldest_macos }}
        run: go build -trimpath -ldflags "-s -w -X main.version=$VERSION -X main.updateFrom=$(cat packaging/update-from)" -o lanhop ./cmd/lanhop
      - name: Check that the program was built without build tags
        run: scripts/release/check-build-tags lanhop
      - name: Check the system and the architecture of the binary
        env:
          LOOKS_LIKE: ${{ matrix.looks_like }}
        run: file lanhop | tee /dev/stderr | grep -F "$LOOKS_LIKE"
      - name: Check that the Linux binary is static
        if: matrix.os == 'linux'
        run: file lanhop | grep -F "statically linked"
      - name: Check the oldest macOS the binary runs on
        if: matrix.os == 'darwin'
        env:
          OLDEST_MACOS: ${{ matrix.oldest_macos }}
        run: otool -l lanhop | grep -A 4 LC_BUILD_VERSION | tee /dev/stderr | grep -F "minos $OLDEST_MACOS"
      - name: Check the version the binary reports
        if: matrix.runs_here
        run: test "$(./lanhop version)" = "lanhop $VERSION"
      - name: Check the version is in the binary
        if: ${{ !matrix.runs_here }}
        run: grep -a -q -F "$VERSION" lanhop
      - name: Put the program in lanhop.app and sign it
        if: matrix.os == 'darwin'
        run: |
          bundle_version=${VERSION#v}
          bundle_version=${bundle_version%%-*}
          case $bundle_version in
            '' | *[!0-9.]*) bundle_version=0.0.0 ;;
          esac
          mkdir -p lanhop.app/Contents/MacOS
          sed "s/@VERSION@/$bundle_version/g" packaging/macos/Info.plist >lanhop.app/Contents/Info.plist
          plutil -lint lanhop.app/Contents/Info.plist
          cp lanhop lanhop.app/Contents/MacOS/lanhop
          codesign --force --sign - --identifier com.github.rodrigogaraujo.lanhop lanhop.app
          echo "BUNDLE_VERSION=$bundle_version" >>"$GITHUB_ENV"
      - name: Check the identity of lanhop.app
        if: matrix.os == 'darwin'
        env:
          OLDEST_MACOS: ${{ matrix.oldest_macos }}
        run: |
          codesign --verify --strict --verbose=2 lanhop.app
          codesign --display --verbose=2 lanhop.app 2>signature
          cat signature
          grep -Fx "Identifier=com.github.rodrigogaraujo.lanhop" signature
          grep -E "^Info.plist entries=[1-9]" signature
          test "$(plutil -extract CFBundleIdentifier raw lanhop.app/Contents/Info.plist)" = com.github.rodrigogaraujo.lanhop
          test "$(plutil -extract CFBundleShortVersionString raw lanhop.app/Contents/Info.plist)" = "$BUNDLE_VERSION"
          test "$(plutil -extract LSMinimumSystemVersion raw lanhop.app/Contents/Info.plist)" = "$OLDEST_MACOS"
          otool -l lanhop.app/Contents/MacOS/lanhop | grep -q LC_UUID
      - name: Check the version the program in lanhop.app reports
        if: matrix.os == 'darwin' && matrix.runs_here
        run: test "$(lanhop.app/Contents/MacOS/lanhop version)" = "lanhop $VERSION"
      - name: Gather what goes into the archive
        env:
          TARGET_OS: ${{ matrix.os }}
        run: |
          mkdir out
          if [ "$TARGET_OS" = darwin ]; then
            mv lanhop.app out/
          else
            mv lanhop out/
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.os == 'darwin' && 'unsigned' || 'lanhop' }}-${{ matrix.os }}-${{ matrix.arch }}
          path: out/
          if-no-files-found: error

  sign-mac:
    name: Sign lanhop.app with the certificate of the project
    needs: build
    runs-on: macos-latest
    environment: ${{ github.event_name == 'push' && github.ref_type == 'tag' && 'release' || '' }}
    outputs:
      certificate_leaf: ${{ steps.certificate.outputs.leaf }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: unsigned-darwin-*
          path: unsigned
      - name: Take the certificate, or make a throwaway one outside a release
        id: certificate
        env:
          LANHOP_SIGNING_CERTIFICATE: ${{ secrets.LANHOP_SIGNING_CERTIFICATE }}
          LANHOP_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.LANHOP_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          signing="$RUNNER_TEMP/signing"
          if [ "$RELEASE_RUN" = true ]; then
            scripts/release/take-certificate "$signing" packaging/macos/certificate-leaf
          elif [ -n "$LANHOP_SIGNING_CERTIFICATE$LANHOP_SIGNING_CERTIFICATE_PASSWORD" ]; then
            echo "::error::a signing secret is reachable outside a release run; keep it only in the environment release"
            exit 1
          else
            scripts/release/make-certificate "$signing"
          fi
          echo "leaf=$(cat "$signing/leaf")" >>"$GITHUB_OUTPUT"
      - name: Sign both apps
        run: |
          chmod 755 unsigned/unsigned-darwin-*/lanhop.app/Contents/MacOS/lanhop
          scripts/release/sign-apps "$RUNNER_TEMP/signing/certificate.p12" "$RUNNER_TEMP/signing/password" unsigned/unsigned-darwin-*/lanhop.app
      - name: Throw away the certificate
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"
      - name: Check the requirement of both apps
        env:
          LEAF: ${{ steps.certificate.outputs.leaf }}
        run: |
          for arch in arm64 amd64; do
            scripts/release/check-app-requirement "unsigned/unsigned-darwin-$arch/lanhop.app" "$LEAF"
            mkdir -p "signed/lanhop-darwin-$arch"
            mv "unsigned/unsigned-darwin-$arch/lanhop.app" "signed/lanhop-darwin-$arch/"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lanhop-darwin-arm64
          path: signed/lanhop-darwin-arm64/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lanhop-darwin-amd64
          path: signed/lanhop-darwin-amd64/
          if-no-files-found: error

  package:
    name: Pack the archives and install from them
    needs: [build, sign-mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: lanhop-*
          path: built
      - name: Pack each binary with the license and the README
        run: |
          mkdir release
          for build in built/lanhop-*; do
            name=$(basename "$build")
            if [ -d "$build/lanhop.app" ]; then
              chmod 755 "$build/lanhop.app/Contents/MacOS/lanhop"
            else
              chmod 755 "$build/lanhop"
            fi
            cp LICENSE README.md "$build/"
            tar -czf "release/$name.tar.gz" --owner=0 --group=0 --numeric-owner -C built "$name"
          done
          printf 'version %s\nfrom %s\n' "$VERSION" "$(cat packaging/update-from)" >release/UPDATE
          cd release
          sha256sum lanhop-*.tar.gz UPDATE | tee SHA256SUMS
          test "$(wc -l <SHA256SUMS)" -eq 5
      - name: Check what each archive holds
        run: |
          for arch in amd64 arm64; do
            tar -tzf "release/lanhop-linux-$arch.tar.gz" | grep -Fx "lanhop-linux-$arch/lanhop"
            tar -tzf "release/lanhop-darwin-$arch.tar.gz" >listing
            grep -Fx "lanhop-darwin-$arch/lanhop.app/Contents/MacOS/lanhop" listing
            grep -Fx "lanhop-darwin-$arch/lanhop.app/Contents/Info.plist" listing
            grep -Fx "lanhop-darwin-$arch/lanhop.app/Contents/_CodeSignature/CodeResources" listing
          done
      - name: Install from these archives with install.sh
        run: |
          mkdir -p served/latest/download
          cp release/* served/latest/download/
          home=$(mktemp -d)
          HOME="$home" LANHOP_RELEASES_URL="file://$PWD/served" sh install.sh </dev/null
          test "$("$home/.local/bin/lanhop" version)" = "lanhop $VERSION"
          test "$(find "$home" -type f)" = "$home/.local/bin/lanhop"
      - name: Check that the installer writes the same unit and udev rule as the one at packaging/update-from
        run: |
          scripts/release/installer-at-from ${{ github.event_name == 'push' && github.ref_type == 'tag' && '--release' || '' }} "$RUNNER_TEMP/installer-at-from"
          scripts/release/compare-installers "$RUNNER_TEMP/installer-at-from" install.sh served
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-to-sign
          path: release/
          if-no-files-found: error

  sign-checksums:
    name: Sign SHA256SUMS with the release key
    needs: package
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && github.ref_type == 'tag' && 'release' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-to-sign
          path: release
      - name: Sign with the release key, or with a throwaway one outside a release
        env:
          RELEASE_KEY: ${{ secrets.LANHOP_RELEASE_KEY }}
        run: |
          umask 077
          key="$RUNNER_TEMP/release-key.pem"
          trap 'rm -f "$key"' EXIT
          if [ "$RELEASE_RUN" = true ]; then
            if [ -z "$RELEASE_KEY" ]; then
              echo "::error::the environment release does not hold LANHOP_RELEASE_KEY"
              exit 1
            fi
            printf '%s\n' "$RELEASE_KEY" >"$key"
          elif [ -n "$RELEASE_KEY" ]; then
            echo "::error::the release key is reachable outside a release run; keep it only in the environment release"
            exit 1
          else
            openssl genpkey -algorithm ed25519 -out "$key"
            mkdir throwaway
            openssl pkey -in "$key" -pubout -out throwaway/release-key.pub
          fi
          scripts/release/sign-checksums "$key" release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: release/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: env.RELEASE_RUN != 'true'
        with:
          name: throwaway-release-key
          path: throwaway/
          if-no-files-found: error

  verify:
    name: Check the signature and UPDATE as lanhop update does
    needs: sign-checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: env.RELEASE_RUN != 'true'
        with:
          name: throwaway-release-key
          path: throwaway
      - name: Check the release with the keys of lanhop, or the throwaway key outside a release
        run: |
          set --
          if [ "$RELEASE_RUN" != true ]; then
            set -- -key throwaway/release-key.pub
          fi
          go run ./scripts/release/verify-release -release release -version "$VERSION" -from "$(cat packaging/update-from)" "$@"
          (cd release && sha256sum -c SHA256SUMS)

  check-mac-archive:
    name: Unpack the macOS archive on a Mac and check the app
    needs: [sign-mac, sign-checksums]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: release
      - name: Check the signature and the program after packing
        env:
          LEAF_OF_THE_RUN: ${{ needs.sign-mac.outputs.certificate_leaf }}
        run: |
          if [ "$RELEASE_RUN" = true ]; then
            LEAF=$(cat packaging/macos/certificate-leaf)
          else
            LEAF=$LEAF_OF_THE_RUN
          fi
          for arch in arm64 amd64; do
            tar -xzf "release/lanhop-darwin-$arch.tar.gz"
            codesign --verify --strict --verbose=2 "lanhop-darwin-$arch/lanhop.app"
            scripts/release/check-app-requirement "lanhop-darwin-$arch/lanhop.app" "$LEAF"
          done
          test "$(lanhop-darwin-arm64/lanhop.app/Contents/MacOS/lanhop version)" = "lanhop $VERSION"
      - name: Install from these archives with install.sh on a Mac
        run: |
          mkdir -p served/latest/download root/Applications
          cp release/* served/latest/download/
          home=$(mktemp -d)
          HOME="$home" LANHOP_RELEASES_URL="file://$PWD/served" LANHOP_SYSTEM_ROOT="$PWD/root" \
            LANHOP_ROLE=share LANHOP_YES=1 LANHOP_PRINT_COMMANDS=1 sh install.sh </dev/null
          program="$PWD/root/Applications/lanhop.app/Contents/MacOS/lanhop"
          test "$("$home/.local/bin/lanhop" version)" = "lanhop $VERSION"
          test "$(readlink "$home/.local/bin/lanhop")" = "$program"
          codesign --verify --strict --verbose=2 root/Applications/lanhop.app
          agent="$home/Library/LaunchAgents/com.github.rodrigogaraujo.lanhop.plist"
          plutil -lint "$agent"
          test "$(plutil -extract AssociatedBundleIdentifiers.0 raw "$agent")" = com.github.rodrigogaraujo.lanhop
          test "$(plutil -extract ProgramArguments.0 raw "$agent")" = "$program"
      - name: Check that the installer writes the same launch agent as the one at packaging/update-from
        run: |
          scripts/release/installer-at-from ${{ github.event_name == 'push' && github.ref_type == 'tag' && '--release' || '' }} "$RUNNER_TEMP/installer-at-from"
          scripts/release/compare-installers "$RUNNER_TEMP/installer-at-from" install.sh served

  publish:
    name: Publish the release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [verify, check-mac-archive]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: release
      - name: Create the release with the archives, UPDATE, SHA256SUMS and its signature
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
